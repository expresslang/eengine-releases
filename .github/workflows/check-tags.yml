name: check-tags

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual triggering for testing
    inputs:
      dry_run:
        description: 'List new tags without dispatching builds'
        required: false
        default: false
        type: boolean
      max_new_tags:
        description: 'Refuse to dispatch more than this many builds in one run'
        required: false
        default: '3'
        type: string

jobs:
  check-tags:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Clone eengine repository
        run: |
          git clone git://git.code.sf.net/p/exp-engine/engine eengine-repo

      - name: Get all eengine tags
        id: get-tags
        run: |
          cd eengine-repo

          # Get all tags matching eeng-* pattern
          ALL_TAGS=$(git tag -l 'eeng-*' | sort -V)

          # Filter for versions >= 5.0.0 (exclude 3.x and 4.x)
          FILTERED_TAGS=$(echo "$ALL_TAGS" | awk -F'-' '{
            split($2, ver, ".");
            major = ver[1];
            if (major >= 5) print $0;
          }')

          echo "Filtered tags (5.x and above):"
          echo "$FILTERED_TAGS"

          # Save to file for next step
          echo "$FILTERED_TAGS" > ../filtered-tags.txt

      - name: Get existing GitHub releases
        id: existing-releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tag names straight from the API. The former `gh release list |
          # awk '{print $3}'` read the date column for every release except
          # the one marked Latest (its TYPE column is blank), so on 2026-09-07
          # it saw one release, called the other 41 tags new, and dispatched
          # 41 builds that replaced the assets of 12 existing releases.
          gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[].tag_name' > existing-releases.txt

          echo "Existing releases:"
          cat existing-releases.txt

          # An empty list is a failure of this step, never "everything is new".
          if [ ! -s existing-releases.txt ]; then
            echo "::error::No existing releases could be listed; refusing to continue"
            exit 1
          fi

      - name: Find new tags
        id: new-tags
        run: |
          # Compare filtered tags with existing releases to find new ones
          NEW_TAGS=$(comm -23 \
            <(sort filtered-tags.txt) \
            <(sort existing-releases.txt))

          echo "New tags to build:"
          echo "$NEW_TAGS"

          # Save as JSON array for matrix
          if [ -n "$NEW_TAGS" ]; then
            echo "has_new_tags=true" >> $GITHUB_OUTPUT
            # Convert to JSON array
            TAGS_JSON=$(echo "$NEW_TAGS" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "tags=$TAGS_JSON" >> $GITHUB_OUTPUT
          else
            echo "has_new_tags=false" >> $GITHUB_OUTPUT
            echo "tags=[]" >> $GITHUB_OUTPUT
          fi

      - name: Trigger build workflow for new tags
        if: steps.new-tags.outputs.has_new_tags == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_NEW_TAGS: ${{ inputs.max_new_tags || '3' }}
        run: |
          TAGS='${{ steps.new-tags.outputs.tags }}'

          # Upstream releases one tag at a time; a long list means the
          # comparison above went wrong, not that many releases are due.
          COUNT=$(echo "$TAGS" | jq 'length')
          if [ "$COUNT" -gt "$MAX_NEW_TAGS" ]; then
            echo "::error::$COUNT new tags exceed the limit of $MAX_NEW_TAGS; refusing to dispatch"
            exit 1
          fi

          echo "$TAGS" | jq -r '.[]' | while read -r tag; do
            echo "Triggering build for tag: $tag"
            gh workflow run build-release.yml \
              --repo ${{ github.repository }} \
              --ref ${{ github.ref }} \
              -f tag_name="$tag"

            # Add a small delay between triggers to avoid rate limiting
            sleep 2
          done

      # GitHub disables a scheduled workflow after 60 days without repository
      # activity, and releases are rare (this check was found disabled on
      # 2026-09-07 with eeng-5.2.8 waiting). Re-enabling it on every run
      # resets that clock.
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT \
            repos/${{ github.repository }}/actions/workflows/check-tags.yml/enable

      - name: Summary
        run: |
          if [ "${{ steps.new-tags.outputs.has_new_tags }}" == "true" ]; then
            echo "### ✅ New tags found and build triggered" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Tags:" >> $GITHUB_STEP_SUMMARY
            echo '${{ steps.new-tags.outputs.tags }}' | jq -r '.[]' | while read -r tag; do
              echo "- \`$tag\`" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "### ℹ️ No new tags found" >> $GITHUB_STEP_SUMMARY
            echo "All existing tags already have releases." >> $GITHUB_STEP_SUMMARY
          fi
