name: build-release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to build and release (e.g., eeng-5.2.7)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            artifact_pattern: 'eengine-*-lnx-x86-64-sbcl'
          - os: ubuntu-22.04-arm
            platform: linux-arm64
            artifact_pattern: 'eengine-*-lnx-arm64-sbcl'
          - os: windows-latest
            platform: windows-x64
            artifact_pattern: 'eengine-*-win-x86-64-sbcl.exe'
          - os: windows-11-arm
            platform: windows-arm64
            artifact_pattern: 'eengine-*-win-arm64-sbcl.exe'
          - os: macos-13
            platform: macos-intel
            artifact_pattern: 'eengine-*-mac-x86-64-sbcl'
          - os: macos-14
            platform: macos-arm64
            artifact_pattern: 'eengine-*-mac-arm64-sbcl'

    steps:
      - name: Install SBCL (Linux)
        if: startsWith(matrix.platform, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl

      - name: Install SBCL (Windows)
        if: startsWith(matrix.platform, 'windows-')
        run: |
          choco install sbcl -y

      - name: Install SBCL (macOS)
        if: startsWith(matrix.platform, 'macos-')
        run: |
          brew install sbcl

      - name: Verify SBCL installation
        run: |
          sbcl --version

      - name: Clone eengine repository
        run: |
          git clone --depth 1 --branch ${{ inputs.tag_name }} git://git.code.sf.net/p/exp-engine/engine eengine

      - name: Build eengine (Unix)
        if: ${{ !startsWith(matrix.platform, 'windows-') }}
        working-directory: eengine
        run: |
          echo "Building eengine for ${{ matrix.platform }}..."
          sbcl --load sbcl/compile.lisp
          sbcl --load sbcl/deliver.lisp

      - name: Build eengine (Windows)
        if: startsWith(matrix.platform, 'windows-')
        working-directory: eengine
        shell: cmd
        run: |
          echo Building eengine for Windows...
          sbcl --load sbcl/compile.lisp
          sbcl --load sbcl/deliver.lisp

      - name: Find and list all generated files
        id: find-binary
        working-directory: eengine
        shell: bash
        run: |
          echo "=== Listing all files in eengine directory ==="
          ls -la

          echo ""
          echo "=== Looking for eengine binaries ==="
          # Look for any file starting with eengine
          BINARIES=$(find . -maxdepth 1 -name "eengine*" -type f)

          if [ -z "$BINARIES" ]; then
            echo "ERROR: No eengine binaries found"
            echo "Full directory listing:"
            ls -laR
            exit 1
          fi

          echo "Found binaries:"
          echo "$BINARIES"

          # Get the first binary (should only be one)
          BINARY=$(echo "$BINARIES" | head -1)

          # Remove ./ prefix if present
          BINARY=${BINARY#./}

          echo ""
          echo "Using binary: $BINARY"

          # Rename to standardized pattern based on platform
          VERSION="${{ inputs.tag_name }}"
          VERSION="${VERSION#eeng-}"

          case "${{ matrix.platform }}" in
            linux-x64)
              NEW_NAME="eengine-${VERSION}-lnx-x86-64-sbcl"
              ;;
            linux-arm64)
              NEW_NAME="eengine-${VERSION}-lnx-arm64-sbcl"
              ;;
            windows-x64)
              NEW_NAME="eengine-${VERSION}-win-x86-64-sbcl.exe"
              ;;
            windows-arm64)
              NEW_NAME="eengine-${VERSION}-win-arm64-sbcl.exe"
              ;;
            macos-intel)
              NEW_NAME="eengine-${VERSION}-mac-x86-64-sbcl"
              ;;
            macos-arm64)
              NEW_NAME="eengine-${VERSION}-mac-arm64-sbcl"
              ;;
          esac

          if [ "$BINARY" != "$NEW_NAME" ]; then
            echo "Renaming: $BINARY → $NEW_NAME"
            mv "$BINARY" "$NEW_NAME"
            BINARY="$NEW_NAME"
          fi

          echo "binary_name=$BINARY" >> $GITHUB_OUTPUT

          # Make executable on Unix platforms
          if [[ ! "${{ matrix.platform }}" =~ ^windows- ]]; then
            chmod +x "$BINARY"
          fi

          # Show file details
          ls -lh "$BINARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-binary
          path: eengine/${{ steps.find-binary.outputs.binary_name }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: |
          ls -R artifacts

      - name: Prepare release files
        id: prepare
        run: |
          mkdir -p release-files

          # Move all binaries to release-files directory
          find artifacts -type f -exec mv {} release-files/ \;

          echo "Release files:"
          ls -lh release-files/

          # Extract version from tag name (e.g., eeng-5.2.7 -> 5.2.7)
          VERSION="${{ inputs.tag_name }}"
          VERSION="${VERSION#eeng-}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ steps.prepare.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-files/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "### ✅ Release Created Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ inputs.tag_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.prepare.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifacts:**" >> $GITHUB_STEP_SUMMARY
          ls -1 release-files/ | while read file; do
            echo "- \`$file\`" >> $GITHUB_STEP_SUMMARY
          done

  trigger-homebrew-update:
    name: Trigger Homebrew Formula Update
    needs: release
    runs-on: ubuntu-latest
    # Only trigger for macOS and Linux builds (skip Windows-only releases)
    if: success()

    steps:
      - name: Extract version from tag
        id: version
        run: |
          VERSION="${{ inputs.tag_name }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Trigger homebrew-eengine workflow
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.EXPRESSLANG_CI_PAT_TOKEN }}
          repository: expresslang/homebrew-eengine
          event-type: update-formula
          client-payload: |
            {
              "version": "${{ steps.version.outputs.version }}",
              "release_url": "https://github.com/expresslang/eengine-releases/releases/tag/${{ inputs.tag_name }}"
            }
