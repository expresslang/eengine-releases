name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to build and release (e.g., eeng-5.2.7)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_pattern: 'eengine-*-lnx-*-sbcl'
          - os: windows-latest
            platform: windows
            artifact_pattern: 'eengine-*-win-*-sbcl.exe'
          - os: macos-14
            platform: macos
            artifact_pattern: 'eengine-*-mac-*-sbcl'

    steps:
      - name: Install SBCL (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl

      - name: Install SBCL (Windows)
        if: matrix.platform == 'windows'
        run: |
          choco install sbcl -y

      - name: Install SBCL (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install sbcl

      - name: Verify SBCL installation
        run: |
          sbcl --version

      - name: Clone eengine repository
        run: |
          git clone --depth 1 --branch ${{ inputs.tag_name }} git://git.code.sf.net/p/exp-engine/engine eengine

      - name: Build eengine (Unix)
        if: matrix.platform != 'windows'
        working-directory: eengine
        run: |
          echo "Building eengine for ${{ matrix.platform }}..."
          sbcl --load sbcl/compile.lisp
          sbcl --load sbcl/deliver.lisp

      - name: Build eengine (Windows)
        if: matrix.platform == 'windows'
        working-directory: eengine
        shell: cmd
        run: |
          echo Building eengine for Windows...
          sbcl --load sbcl/compile.lisp
          sbcl --load sbcl/deliver.lisp

      - name: Find and verify binary
        id: find-binary
        working-directory: eengine
        shell: bash
        run: |
          echo "Looking for binary matching pattern: ${{ matrix.artifact_pattern }}"

          # Find the built binary
          BINARY=$(find . -maxdepth 1 -name "${{ matrix.artifact_pattern }}" -type f | head -1)

          if [ -z "$BINARY" ]; then
            echo "ERROR: No binary found matching pattern ${{ matrix.artifact_pattern }}"
            ls -la
            exit 1
          fi

          # Remove ./ prefix if present
          BINARY=${BINARY#./}

          echo "Found binary: $BINARY"
          echo "binary_name=$BINARY" >> $GITHUB_OUTPUT

          # Verify it exists and is executable (except on Windows)
          if [ "${{ matrix.platform }}" != "windows" ]; then
            chmod +x "$BINARY"
          fi

          ls -lh "$BINARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-binary
          path: eengine/${{ steps.find-binary.outputs.binary_name }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: |
          ls -R artifacts

      - name: Prepare release files
        id: prepare
        run: |
          mkdir -p release-files

          # Move all binaries to release-files directory
          find artifacts -type f -exec mv {} release-files/ \;

          echo "Release files:"
          ls -lh release-files/

          # Extract version from tag name (e.g., eeng-5.2.7 -> 5.2.7)
          VERSION="${{ inputs.tag_name }}"
          VERSION="${VERSION#eeng-}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: eengine ${{ steps.prepare.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-files/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "### ✅ Release Created Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ inputs.tag_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.prepare.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifacts:**" >> $GITHUB_STEP_SUMMARY
          ls -1 release-files/ | while read file; do
            echo "- \`$file\`" >> $GITHUB_STEP_SUMMARY
          done
